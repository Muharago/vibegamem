<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BREAKOUT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="inapp-banner" style="display:none;">
  <span id="inapp-msg"></span>
  <a id="inapp-link" href="">외부 브라우저로 열기</a>
  <button id="inapp-close" onclick="document.getElementById('inapp-banner').style.display='none'">✕</button>
</div>

<div id="wrapper">

  <div id="event-banner">
    <i>🏆</i> <span id="banner-text"></span>
  </div>

  <div id="hud">
    <div>SCORE&nbsp;<span id="score-val">0</span></div>
    <div id="level-badge">LV&nbsp;<span id="level-val">1</span></div>
    <div id="multiplier-badge" style="display:none;">×<span id="mult-val">1</span></div>
    <div>BEST&nbsp;<span id="best-val">0</span></div>
    <div>LIVES&nbsp;<span id="lives-val">♥ ♥ ♥</span></div>
  </div>

  <div id="game-area" tabindex="0">
    <div id="paddle"></div>
    <div id="overlay">
      <h1>BREAKOUT</h1>
      <p class="sub">
        화면을 좌우로 스와이프해서 패들 이동<br>
        하단 버튼으로도 조작 가능<br><br>
        파워업 아이템<br>
        <em>+B</em> 멀티볼 &nbsp; <em>+W</em> 바확장 &nbsp; <em>+S</em> 속도2배
      </p>
      <button class="ov-btn" id="start-btn">START GAME</button>
    </div>
    <div id="name-modal" style="display:none;">
      <h2>NEW RECORD!</h2>
      <p class="modal-sub">이번 달 랭킹에 등록됩니다</p>
      <input id="name-input" maxlength="8" placeholder="닉네임 (8자)" autocomplete="off"/>
      <input id="email-input" type="email" placeholder="이메일 (당첨 연락용)" autocomplete="off"/>
      <label id="privacy-label">
        <input type="checkbox" id="privacy-check"/>
        <span>이메일은 이벤트 당첨 연락 목적으로만 사용됩니다</span>
      </label>
      <p id="privacy-error" style="display:none;">동의가 필요해요</p>
      <button id="name-submit">SAVE</button>
    </div>
  </div>

  <div id="powerup-hud"></div>

  <div id="touch-controls">
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-pause">II</button>
    <button class="touch-btn" id="btn-right">▶</button>
  </div>

  <div style="display:flex;justify-content:flex-end;width:var(--gw);">
    <button id="leaderboard-btn">RANKING ▾</button>
  </div>

  <div id="lb-panel">
    <h2>HALL OF FAME</h2>
    <p id="lb-period"></p>
    <div id="lb-list"></div>
  </div>

  <div id="footer">
    <span>◀▶</span> 버튼 또는 스와이프 &nbsp;|&nbsp; <span>II</span> 일시정지
  </div>

</div>

<script type="module">
import { initializeApp }     from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, limit, Timestamp }
  from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgxsHUQWz36dLbeMOjBOGpXmwz0-NC1AI",
  authDomain: "vibegame-gang.firebaseapp.com",
  projectId: "vibegame-gang",
  storageBucket: "vibegame-gang.firebasestorage.app",
  messagingSenderId: "588266757448",
  appId: "1:588266757448:web:1ec8856cebe9072001277d",
  measurementId: "G-GGB374NH3S"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* ── 월별 기간 계산 ── */
function getMonthRange() {
  const now   = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end   = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
  return { start, end };
}

function formatDate(d) {
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

/* ── 이벤트 배너 ── */
function renderBanner() {
  const { start, end } = getMonthRange();
  document.getElementById('banner-text').textContent =
    `이달의 랭킹 이벤트 ${formatDate(start)} ~ ${formatDate(end)} | 1~3위 선물 증정!`;
}
renderBanner();

/* ── 이달 기간 표시 ── */
function renderPeriod() {
  const { start, end } = getMonthRange();
  document.getElementById('lb-period').textContent =
    `${formatDate(start)} ~ ${formatDate(end)}`;
}

/* ── Firestore 점수 저장 ── */
window.saveScoreOnline = async function(name, email, score, level) {
  try {
    await addDoc(collection(db, 'scores'), {
      name:  name.toUpperCase().slice(0,8) || 'ANON',
      email: email,
      score: score,
      level: level,
      date:  Timestamp.fromDate(new Date())
    });
  } catch(e) {
    console.error('점수 저장 실패:', e);
  }
};

/* ── Firestore 이달 순위 불러오기 ── */
window.loadOnlineLeaderboard = async function() {
  const { start, end } = getMonthRange();
  renderPeriod();
  const lbList = document.getElementById('lb-list');
  lbList.innerHTML = '<p class="lb-empty">불러오는 중...</p>';
  try {
    const q = query(
      collection(db, 'scores'),
      where('date', '>=', Timestamp.fromDate(start)),
      where('date', '<=', Timestamp.fromDate(end)),
      orderBy('date'),
      limit(20)
    );
    const snap = await getDocs(q);
    const docs = [];
    snap.forEach(d => docs.push(d.data()));
    docs.sort((a,b) => b.score - a.score);
    const top = docs.slice(0, 10);
    if (!top.length) {
      lbList.innerHTML = '<p class="lb-empty">이번 달 기록이 없어요</p>';
      return;
    }
    const rc = ['gold','silver','bronze'];
    lbList.innerHTML = top.map((e,i) => `
      <div class="lb-row">
        <span class="lb-rank ${rc[i]||''}">${i+1}.</span>
        <span class="lb-name">${e.name}</span>
        <span class="lb-score">${e.score.toLocaleString()}</span>
      </div>`).join('');
  } catch(e) {
    lbList.innerHTML = '<p class="lb-empty">불러오기 실패. 잠시 후 다시 시도해주세요.</p>';
  }
};
</script>

<script>
(function() {
  const ua = navigator.userAgent || '';
  const isKakao    = /KAKAOTALK/i.test(ua);
  const isNaver    = /NAVER/i.test(ua) && /inapp/i.test(ua);
  const isLine     = /Line\//i.test(ua);
  const isFacebook = /FBAV|FBAN/i.test(ua);
  const isInApp    = isKakao || isNaver || isLine || isFacebook;

  if (!isInApp) return;

  const banner  = document.getElementById('inapp-banner');
  const msg     = document.getElementById('inapp-msg');
  const link    = document.getElementById('inapp-link');
  const pageUrl = location.href;

  let appName = '인앱 브라우저';
  if (isKakao)    appName = '카카오톡';
  if (isNaver)    appName = '네이버';
  if (isLine)     appName = 'LINE';
  if (isFacebook) appName = '페이스북';

  msg.textContent = appName + '에서는 게임이 제대로 동작하지 않을 수 있어요.';

  const isIOS     = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);

  if (isAndroid) {
    link.href = 'intent://' + pageUrl.replace(/^https?:\/\//, '') +
      '#Intent;scheme=https;action=android.intent.action.VIEW;' +
      'package=com.android.chrome;end';
    link.textContent = 'Chrome으로 열기';
  } else if (isIOS) {
    link.href = pageUrl;
    link.onclick = function(e) {
      e.preventDefault();
      // iOS: 클립보드에 URL 복사 후 안내
      if (navigator.clipboard) {
        navigator.clipboard.writeText(pageUrl).then(() => {
          alert('링크가 복사되었어요!\nSafari 주소창에 붙여넣기 해주세요.');
        });
      } else {
        prompt('아래 주소를 복사해서 Safari에서 열어주세요:', pageUrl);
      }
    };
    link.textContent = 'Safari로 열기';
  } else {
    link.href = pageUrl;
    link.target = '_blank';
    link.textContent = '외부 브라우저로 열기';
  }

  banner.style.display = 'flex';
})();
</script>

<script src="game.js" defer></script>
</body>
</html>
