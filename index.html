<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BREAKOUT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrapper">

  <div id="hud">
    <div>SCORE&nbsp;<span id="score-val">0</span></div>
    <div id="level-badge">LV&nbsp;<span id="level-val">1</span></div>
    <div>BEST&nbsp;<span id="best-val">0</span></div>
    <div>LIVES&nbsp;<span id="lives-val">♥ ♥ ♥</span></div>
  </div>

  <div id="game-area" tabindex="0">
    <div id="paddle"></div>
    <div id="overlay">
      <h1>BREAKOUT</h1>
      <p class="sub">
        화면을 좌우로 스와이프해서 패들 이동<br>
        하단 버튼으로도 조작 가능<br><br>
        파워업 아이템<br>
        <em>+B</em> 멀티볼 &nbsp; <em>+W</em> 바확장 &nbsp; <em>+S</em> 속도2배
      </p>
      <button class="ov-btn" id="start-btn">START GAME</button>
    </div>
    <div id="name-modal" style="display:none;">
      <h2>NEW RECORD!</h2>
      <p>닉네임을 입력하세요</p>
      <input id="name-input" maxlength="8" placeholder="PLAYER" autocomplete="off"/>
      <button id="name-submit">SAVE</button>
    </div>
  </div>

  <div id="powerup-hud"></div>

  <div id="touch-controls">
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-pause">II</button>
    <button class="touch-btn" id="btn-right">▶</button>
  </div>

  <div style="display:flex;justify-content:flex-end;width:var(--gw);">
    <button id="leaderboard-btn">RANKING ▾</button>
  </div>

  <div id="lb-panel">
    <h2>HALL OF FAME</h2>
    <div id="lb-list"></div>
  </div>

  <div id="footer">
    <span>◀▶</span> 버튼 또는 스와이프 &nbsp;|&nbsp; <span>II</span> 일시정지
  </div>

</div>
<script src="game.js" defer></script>
</body>
</html>
